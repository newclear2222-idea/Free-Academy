# 매일 오르비 사설 모의고사 무료배포 글 목록을 갱신한다 (파일은 받지 않고 링크만)
name: 모의고사 피드 갱신
on:
  schedule:
    - cron: "17 21 * * *"   # 매일 오전 6시 17분 (한국 시간)
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_mock.py
      - .github/workflows/mock-feed.yml
permissions:
  contents: write
concurrency: mock-feed
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 오르비에서 목록 가져오기
        run: python3 scripts/fetch_mock.py && sh scripts/build.sh
      - name: 바뀐 내용 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mock-feed.json src/page.html index.html
          if git diff --cached --quiet; then echo "새 글 없음"; exit 0; fi
          git commit -m "모의고사 피드 갱신 $(date +%F)"
          git push
