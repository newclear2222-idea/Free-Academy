<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@500;600&display=swap">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#f6f7f4;font-family:"IBM Plex Sans KR",sans-serif;color:#1d2433;position:relative;overflow:hidden}
.sheet{position:absolute;inset:48px;background:#fff;border:2px solid #dde1e6;border-radius:28px;padding:64px 72px;box-shadow:0 18px 40px rgba(29,36,51,.08)}
.tab{position:absolute;top:-2px;right:72px;background:#1f4fd1;color:#fff;font-weight:600;font-size:26px;padding:14px 26px;border-radius:0 0 16px 16px}
h1{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:112px;letter-spacing:-1px;line-height:1}
h1 mark{background:linear-gradient(transparent 58%,#ffe680 58%);color:inherit}
p{margin-top:26px;font-size:36px;color:#5d6676;font-weight:500}
.chips{position:absolute;left:72px;right:72px;bottom:60px;display:flex;flex-wrap:wrap;gap:14px}
.chips span{font-size:27px;font-weight:600;padding:10px 20px;border-radius:999px;background:#e7edfc;color:#1f4fd1}
.chips span.g{background:#e3f3ea;color:#1f7a4d}
</style></head><body><div class="sheet"><div class="tab">전부 무료</div>
<h1>무료 <mark>아카데미</mark> 월드</h1>
<p>학원 운영비를 아끼는 무료 자료를 한곳에</p>
<div class="chips"><span>초·중·고 기출</span><span>무료 문제은행</span><span>약술형 논술</span><span>사설 모의고사</span><span class="g">관리 프로그램</span><span class="g">세무·노무</span><span class="g">지원금</span><span class="g">운영 양식</span></div>
</div></body></html>
